<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <script>
            function operacion(){
                let num1 = document.getElementById("num1");
                let num2 = document.getElementById("num2");
                alert('el resultado es' + (parseInt(num1.value) + parseInt(num2.value)));
            }
            function soloEnteros(){
                let num = event.key;
                if(!(num >= 0 && num <= 9)) event.returnValue=false;
            }
            function valEnteros(e){
                let letras = "0123456789";
                
                let x = e.which || e.keyCode;
                let letra = String.fromCharCode(x);
                let n = letras.indexOf(letra);
                if(n === -1) return false;
            }
        </script>
        
        <form>
            <input type="text" id="num1" onkeypress="return soloEnteros()">
            <input type="text" id="num2" onkeypress="return valEnteros(event)">
            <input type="button" onclick="operacion()" value="sumar">
        </form>
    </body>
</html>
