        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form>
            <div>
                Nombre:<input type="text" placeholder="Nombre" id="inputNombre" onkeypress="return valLetras(event)"><br>
                Boleta:<input type="text" placeholder="Boleta" id="inputBoleta" onkeypress="return valEnteros(event)"><br>
            <p>Especialidad</p>
            <select required>
                <option selected disabled>Selecciona una opción</option>
                <option>Tronco Común</option>
                <option>Programacion</option>
                <option>Mecatrónica</option>
                <option>Sistemas digitales</option>
            </select>
            </div>
            <div>
                
            </div>
            <p>Idiomas</p>
            Ingles<input type="checkbox" value="Ingles" name="check">
            Español<input type="checkbox" value="Español" name="check">
            Frances<input type="checkbox" value="Frances" name="check">
            <p>Turno</p>
            Matutino <input type="radio" value="Matutino" name="turno">
            Vespertino <input type="radio" value="Vespertino" name="turno">
            <br>
            Beca <input type="text" id="beca" onkeypress="return valDecimales(event,beca)">
            <br>
            <input type="button" value="Validar" id="validar" onclick="validarFormulario()">
        </form>
        <script>
            const botonValidar = document.getElementById("validar");
            
            function validarFormulario(){
                let inputs = document.getElementsByTagName("input");
                for(let i = 0; i < inputs.length; i++){
                    if(inputs[i].value === ""){
                        inputs[i].focus();
                        alert("Faltan datoz del formulario");
                        return;
                    }
                }
            }
            function valEnteros(e){
                let letras = "0123456789";
                
                let x = e.which || e.keyCode;
                let letra = String.fromCharCode(x);
                let n = letras.indexOf(letra);
                if(n === -1) return false;
            }
            
        function valDecimales(e, input){
                let letras = "0123456789.";
                let cadena = input.value;
                let x = e.which || e.keyCode;
                
                let letra = String.fromCharCode(x);
                
                if(cadena.indexOf(".") !== -1 && letra === "."){
                    return false;
                }
                
                let n = letras.indexOf(letra);
                if(n === -1) return false;
            }    
        
        
        function valLetras(e){
                let x = e.which || e.keyCode;
                console.log(x);
                if(!((x >= 65 && x <= 90) || (x >= 97 && x <= 122)))
                    return false;
            }
        </script>
    </body>
